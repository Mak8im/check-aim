<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer - Тренажер реакции</title>
    <link rel="icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQEAYAAABPYyMiAAAABmJLR0T///////8JWPfcAAAACXBIWXMAAABIAAAASABGyWs+AAAAF0lEQVRIx2NgGAWjYBSMglEwCkbBSAcACgAAAev/aR1V4AAAAABJRU5ErkJggg==" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff4d4d, #ff9999);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 77, 77, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 20px;
        }

        .game-controls {
            background: rgba(40, 40, 40, 0.8);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }

        .time-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            justify-content: center;
        }

        .time-option input {
            display: none;
        }

        .time-label {
            padding: 12px 20px;
            background: rgba(60, 60, 60, 0.7);
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
            width: 100%;
            text-align: center;
        }

        .time-option input:checked + .time-label {
            background: linear-gradient(135deg, #ff4d4d, #ff3333);
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            font-size: 1.2rem;
            width: 100%;
        }

        .stat {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 5px;
            color: #ff4d4d;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #4d79ff, #3366ff);
            color: white;
            box-shadow: 0 4px 15px rgba(77, 121, 255, 0.4);
            flex: 1;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(77, 121, 255, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        #startBtn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        #startBtn:hover {
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        #resetBtn {
            background: linear-gradient(135deg, #ff9800, #e68900);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        #resetBtn:hover {
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 400px;
            background: rgba(25, 25, 25, 0.9);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .target {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .target:hover {
            transform: scale(1.05);
        }

        .instructions {
            margin-top: 30px;
            text-align: center;
            color: #aaa;
            line-height: 1.6;
            width: 100%;
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-over.active {
            opacity: 1;
            pointer-events: all;
        }

        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ff4d4d;
        }

        .final-score {
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .game-area {
                height: 350px;
            }
            
            .time-selection {
                flex-wrap: wrap;
            }
            
            .time-option {
                flex: 0 0 calc(50% - 10px);
            }
        }

        @media (max-width: 480px) {
            .time-option {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Aim Trainer</h1>
            <p class="subtitle">Тренажер для развития скорости реакции и точности</p>
        </header>
        
        <div class="game-controls">
            <div class="time-selection">
                <div class="time-option">
                    <input type="radio" id="time10" name="gameTime" value="10" checked>
                    <label for="time10" class="time-label">10 секунд</label>
                </div>
                <div class="time-option">
                    <input type="radio" id="time30" name="gameTime" value="30">
                    <label for="time30" class="time-label">30 секунд</label>
                </div>
                <div class="time-option">
                    <input type="radio" id="time60" name="gameTime" value="60">
                    <label for="time60" class="time-label">60 секунд</label>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div>Таймер</div>
                    <div id="timer" class="stat-value">00</div>
                </div>
                <div class="stat">
                    <div>Счет</div>
                    <div id="score" class="stat-value">0</div>
                </div>
            </div>
            
            <div class="buttons">
                <button id="startBtn">Старт</button>
                <button id="resetBtn">Сброс</button>
            </div>
        </div>
        
        <div class="game-area" id="gameArea">
            <!-- Цели будут добавляться здесь динамически -->
            <div class="game-over" id="gameOver">
                <h2>Игра окончена!</h2>
                <div class="final-score">Ваш счет: <span id="finalScore">0</span></div>
                <button id="restartBtn">Играть снова</button>
            </div>
        </div>
        
        <div class="instructions">
            <p>Кликните на как можно больше красных кружков за отведенное время.</p>
            <p>Кружки постоянно двигаются и отскакивают от границ экрана.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Получаем элементы DOM
            const gameArea = document.getElementById('gameArea');
            const timerElement = document.getElementById('timer');
            const scoreElement = document.getElementById('score');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const restartBtn = document.getElementById('restartBtn');
            const gameOverScreen = document.getElementById('gameOver');
            const finalScoreElement = document.getElementById('finalScore');
            const timeOptions = document.querySelectorAll('input[name="gameTime"]');
            
            // Переменные игры
            let gameActive = false;
            let timer = 0;
            let score = 0;
            let gameTime = 10;
            let targets = [];
            let animationFrameId;
            let countdownInterval;
            
            // Установка времени игры
            timeOptions.forEach(option => {
                option.addEventListener('change', function() {
                    if (!gameActive) {
                        gameTime = parseInt(this.value);
                        timerElement.textContent = formatTime(gameTime);
                    }
                });
            });
            
            // Функция форматирования времени
            function formatTime(seconds) {
                return seconds < 10 ? `0${seconds}` : `${seconds}`;
            }
            
            // Создание цели
            function createTarget() {
                const target = document.createElement('div');
                target.className = 'target';
                
                // Размер цели (от 30 до 60 пикселей)
                const size = Math.floor(Math.random() * 31) + 30;
                target.style.width = `${size}px`;
                target.style.height = `${size}px`;
                
                // Случайная позиция с учетом границ
                const maxX = gameArea.offsetWidth - size;
                const maxY = gameArea.offsetHeight - size;
                const x = Math.floor(Math.random() * maxX);
                const y = Math.floor(Math.random() * maxY);
                
                target.style.left = `${x}px`;
                target.style.top = `${y}px`;
                
                // Градиент для объема
                target.style.background = 'radial-gradient(circle at 30% 30%, #ff6666, #cc0000)';
                target.style.boxShadow = '0 4px 15px rgba(255, 0, 0, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.3)';
                
                // Случайная начальная скорость
                const speed = 1 + Math.random() * 2;
                const angle = Math.random() * Math.PI * 2;
                const velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                
                // Добавляем цель в массив и на игровое поле
                targets.push({
                    element: target,
                    x: x,
                    y: y,
                    velocity: velocity,
                    size: size
                });
                
                gameArea.appendChild(target);
                
                // Обработчик клика по цели
                target.addEventListener('click', function() {
                    if (gameActive) {
                        // Увеличиваем счет
                        score++;
                        scoreElement.textContent = score;
                        
                        // Удаляем цель
                        gameArea.removeChild(target);
                        targets = targets.filter(t => t.element !== target);
                        
                        // Создаем новую цель
                        createTarget();
                    }
                });
            }
            
            // Обновление позиции целей
            function updateTargets() {
                const areaWidth = gameArea.offsetWidth;
                const areaHeight = gameArea.offsetHeight;
                
                targets.forEach(target => {
                    // Обновляем позицию
                    target.x += target.velocity.x;
                    target.y += target.velocity.y;
                    
                    // Проверяем столкновение с границами
                    if (target.x <= 0 || target.x + target.size >= areaWidth) {
                        target.velocity.x *= -1;
                        target.x = target.x <= 0 ? 0 : areaWidth - target.size;
                    }
                    
                    if (target.y <= 0 || target.y + target.size >= areaHeight) {
                        target.velocity.y *= -1;
                        target.y = target.y <= 0 ? 0 : areaHeight - target.size;
                    }
                    
                    // Применяем новую позицию
                    target.element.style.left = `${target.x}px`;
                    target.element.style.top = `${target.y}px`;
                });
            }
            
            // Игровой цикл
            function gameLoop() {
                if (gameActive) {
                    updateTargets();
                    animationFrameId = requestAnimationFrame(gameLoop);
                }
            }
            
            // Начало игры
            function startGame() {
                if (gameActive) return;
                
                // Сброс состояния
                gameActive = true;
                score = 0;
                scoreElement.textContent = score;
                timer = gameTime;
                timerElement.textContent = formatTime(timer);
                
                // Очистка целей
                targets.forEach(target => {
                    gameArea.removeChild(target.element);
                });
                targets = [];
                
                // Создание начальных целей
                for (let i = 0; i < 5; i++) {
                    createTarget();
                }
                
                // Запуск игрового цикла
                gameLoop();
                
                // Запуск таймера
                countdownInterval = setInterval(() => {
                    timer--;
                    timerElement.textContent = formatTime(timer);
                    
                    if (timer <= 0) {
                        clearInterval(countdownInterval);
                        endGame();
                    }
                }, 1000);
                
                // Скрытие экрана завершения игры
                gameOverScreen.classList.remove('active');
            }
            
            // Завершение игры
            function endGame() {
                gameActive = false;
                cancelAnimationFrame(animationFrameId);
                clearInterval(countdownInterval);
                
                // Показ экрана завершения игры
                finalScoreElement.textContent = score;
                gameOverScreen.classList.add('active');
            }
            
            // Сброс игры
            function resetGame() {
                gameActive = false;
                cancelAnimationFrame(animationFrameId);
                clearInterval(countdownInterval);
                
                // Сброс состояния
                score = 0;
                scoreElement.textContent = score;
                timer = gameTime;
                timerElement.textContent = formatTime(timer);
                
                // Очистка целей
                targets.forEach(target => {
                    gameArea.removeChild(target.element);
                });
                targets = [];
                
                // Скрытие экрана завершения игры
                gameOverScreen.classList.remove('active');
            }
            
            // Назначение обработчиков событий
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);
            restartBtn.addEventListener('click', startGame);
            
            // Инициализация таймера
            timerElement.textContent = formatTime(gameTime);
        });
    </script>
</body>
</html>
